name: Apply Natural v2 feedback

on:
  push:
    branches: [feature/natural-v2]
    paths:
      - '.automation/**'
      - '.github/workflows/apply-feedback.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: smooth vocal fundamental and match Phase Pocket UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          tr -d '\n\r' < .automation/feedback.patch.xz.b64 | base64 --decode | xz --decompress > /tmp/feedback.patch
          git apply --check /tmp/feedback.patch
          git apply /tmp/feedback.patch
          rm -rf .automation .github/workflows/apply-feedback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: smooth vocal fundamental and match Phase Pocket UI'
          git push origin HEAD:feature/natural-v2
